<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cellule de crise — France 2015-2017</title>
<style>
:root {
  --fond:#0a0e11; --panneau:#10171c; --panneau2:#151e24; --bord:#24323b; --texte:#c6d2d8; --pale:#7d8f99;
  --ambre:#e0a030; --rouge:#d9534f; --vert:#4caf7a; --cyan:#5bc0de; --violet:#a58bd6;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--fond); color:var(--texte); font-family:Consolas,'Lucida Console','Courier New',monospace; font-size:12px; min-width:1280px; overflow:hidden; }
button { font-family:inherit; font-size:11px; background:#1b2730; color:var(--texte); border:1px solid #33454f; padding:3px 7px; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--ambre); color:#fff; }
button:disabled { opacity:.4; cursor:not-allowed; }
button.primaire { background:#3a2a0c; border-color:var(--ambre); color:#ffd27a; }
button.danger { border-color:var(--rouge); color:#ffb3b0; }
button.mini { padding:0 5px; min-width:20px; }
input, select { font-family:inherit; font-size:12px; background:#0d1418; color:var(--texte); border:1px solid #33454f; padding:3px 5px; }
h2 { font-size:12px; margin:0 0 6px; color:var(--ambre); letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--bord); padding-bottom:3px; }
h3 { font-size:11px; margin:8px 0 4px; color:var(--cyan); text-transform:uppercase; }
#app { display:grid; grid-template-columns:290px 1fr 350px; grid-template-rows:auto 1fr 230px; height:100vh; gap:4px; padding:4px; }
#bandeau { grid-column:1 / 4; display:flex; align-items:center; gap:4px 12px; background:var(--panneau); border:1px solid var(--bord); padding:5px 10px; flex-wrap:wrap; }
#bandeau .titre { color:var(--ambre); font-weight:bold; letter-spacing:2px; }
.ind { display:flex; flex-direction:column; line-height:1.2; cursor:help; }
.ind .lib { color:var(--pale); font-size:10px; text-transform:uppercase; }
.ind .val { font-size:13px; color:#fff; white-space:nowrap; }
.ind .delta { font-size:10px; margin-left:3px; }
.ind .delta.p { color:var(--vert); } .ind .delta.n { color:var(--rouge); }
.ind .val.alerte { color:var(--rouge); } .ind .val.moyen { color:var(--ambre); } .ind .val.bon { color:var(--vert); }
#bandeau .boutons { margin-left:auto; display:flex; gap:5px; flex-wrap:wrap; }
.effets { display:block; color:var(--pale); font-size:11px; margin-top:3px; }
.aide p { margin:4px 0 8px; }
.panneau { background:var(--panneau); border:1px solid var(--bord); padding:8px; overflow-y:auto; min-height:0; }
#centre { padding:0; position:relative; overflow:hidden; }
#carte { width:100%; height:100%; display:block; }
#bas { grid-column:1 / 4; display:flex; gap:10px; }
#bas > .bloc { flex:1; min-width:0; overflow-y:auto; border-right:1px solid var(--bord); padding-right:8px; }
#bas > .bloc:last-child { border-right:none; flex:0 0 250px; }
.ligne { display:flex; align-items:center; gap:6px; padding:2px 0; }
.ligne .g { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.unite { padding:3px 4px; border:1px solid transparent; cursor:pointer; }
.unite:hover, .service:hover { border-color:#33454f; }
.unite.sel, .service.sel { border-color:var(--ambre); background:#1a1408; }
.service { padding:3px 4px; border:1px solid transparent; cursor:pointer; margin-bottom:3px; }
.etat { font-size:10px; padding:0 4px; border:1px solid; white-space:nowrap; }
.etat.disponible { color:var(--vert); } .etat.projection { color:var(--cyan); } .etat.deployee { color:var(--ambre); }
.etat.regeneration { color:var(--violet); } .etat.indisponible { color:var(--pale); }
.barre { height:4px; background:#222d34; margin-top:2px; } .barre > div { height:100%; }
.pale { color:var(--pale); } .violet { color:var(--violet); } .rouge { color:var(--rouge); } .vert { color:var(--vert); } .ambre { color:var(--ambre); } .cyan { color:var(--cyan); }
.rapport { border-left:2px solid var(--cyan); padding:2px 6px; margin-bottom:4px; }
.rapport .ent { color:var(--pale); font-size:10px; }
.journal div { padding:2px 0; border-bottom:1px dotted #1d282f; }
.journal .tour { color:var(--ambre); border-bottom:none; padding-top:6px; }
.journal .alerte { color:#f0a5a2; } .journal .succes { color:#8fd6ad; } .journal .crise { color:var(--rouge); font-weight:bold; }
.journal .evenement { color:var(--cyan); } .journal .decision { color:#d8dfe3; } .journal .info { color:var(--pale); }
.grille-capteurs { display:grid; grid-template-columns:110px repeat(3, 1fr); gap:2px 6px; align-items:center; }
.cap { display:flex; align-items:center; gap:3px; }
#modal-fond, #zoom { position:fixed; inset:0; background:rgba(3,6,8,.82); display:flex; align-items:center; justify-content:center; z-index:20; }
#modal-fond { z-index:25; }
#modal-fond[hidden], #zoom[hidden], #debug[hidden] { display:none; }
#modal { background:var(--panneau2); border:1px solid var(--ambre); width:760px; max-height:88vh; overflow-y:auto; padding:16px 18px; }
#modal .entete { color:var(--ambre); font-size:14px; letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
#modal p { line-height:1.5; }
.choix { display:block; width:100%; text-align:left; padding:8px; margin:6px 0; font-size:12px; }
.cartes-doctrine { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.carte-doctrine { border:1px solid #33454f; padding:10px; cursor:pointer; background:#10171c; }
.carte-doctrine:hover { border-color:var(--ambre); }
table.t { border-collapse:collapse; width:100%; } table.t td, table.t th { border-bottom:1px solid var(--bord); padding:3px 5px; text-align:left; }
table.t th { color:var(--pale); font-weight:normal; }
#zoom { align-items:stretch; justify-content:stretch; padding:10px; }
#zoom .cadre { flex:1; display:grid; grid-template-columns:260px 1fr 330px; grid-template-rows:auto 1fr 170px; gap:4px; background:var(--fond); border:1px solid var(--ambre); padding:4px; }
#zoom .cadre > .zh { grid-column:1 / 4; }
#zoom .cadre > .zb { grid-column:1 / 4; }
#zoomcarte { width:100%; height:100%; display:block; }
#debug { position:fixed; right:8px; bottom:8px; width:560px; max-height:70vh; overflow-y:auto; background:#120c14; border:1px solid var(--violet); padding:8px; z-index:30; }
#debug h2 { color:var(--violet); }
#infobulle { position:fixed; z-index:50; max-width:340px; background:#05080a; border:1px solid var(--cyan); padding:6px 8px; pointer-events:none; display:none; line-height:1.4; white-space:pre-line; }
#toast { position:fixed; left:50%; top:60px; transform:translateX(-50%); z-index:40; background:#16110a; border:1px solid var(--ambre); padding:8px 12px; max-width:700px; display:none; }
svg text { font-family:Consolas,'Courier New',monospace; }
.clic { cursor:pointer; }
@keyframes clign { 50% { opacity:.25; } }
.clignote { animation:clign 1.2s infinite; }
</style>
</head>

      { id:'TOMBOUCTOU_MENACEE', titre:'Tombouctou menacée',

        objectifs:[{type:'tenir', lieu:'TOMBOUCTOU'}, {type:'controler', lieu:'GOURMA'}],

      { id:'IFOGHAS_SANCTUAIRE', titre:'Sanctuaire de l’Adrar des Ifoghas',
        texte:'Le renseignement signale la reconstitution d’une base logistique dans l’Adrar des Ifoghas.',
        objectifs:[{type:'controler', lieu:'IFOGHAS'}, {type:'attrition', valeur:30}],

      { id:'OTAGES_MENAKA', titre:'Otages dans la région de Ménaka',

// Paramètres de règles exprimés en données (seuils, coefficients)
const PARAMS = {
  actionsBase:2, actionsParCapital:25, actionsMax:6,
  capitalMensuel:2, opinionRappel:0.05,
  regenerationTours:2, fatigueRepos:15, fatigueDeploiement:6,
  dureeAvantVote:4, probaEvenement:0.65, toursCriseLibre:2,
  margeMin:4, rensFauxRapport:30,
  plafondProtection:0.5   // part maximale de la menace intérieure que la protection peut absorber
};

// =====================================================================
// COUCHE 2 — SIMULATION
// Fonctions pures : aucune lecture ni écriture du DOM. Chaque fonction
// publique reçoit un état, le clone et renvoie un nouvel état.
// =====================================================================

function indexer(liste) { const o = {}; for (const x of liste) o[x.id] = x; return o; }
const TH = indexer(THEATRES), UN = indexer(UNITES), SV = indexer(SERVICES),
      MT = indexer(MENACES), OP = indexer(OPERATIONS), DOC = indexer(DOCTRINES), EV = indexer(EVENEMENTS), AL = indexer(ALLIES);

function cloner(s) { return JSON.parse(JSON.stringify(s)); }
function borner(v, a, b) { return v < a ? a : (v > b ? b : v); }
function arrondi(v) { return Math.round(v * 10) / 10; }

// Clé canonique d'une action (comparaison indépendante de l'ordre des champs)
function cleAction(a) {
  const k = Object.keys(a).sort();
  return k.map(x => x + '=' + JSON.stringify(a[x])).join('&');
}

// ---------- Générateur pseudo-aléatoire mulberry32 (état dans s.rngState) ----------
function graineVersEntier(g) {
  const t = String(g).trim();
  if (/^\d+$/.test(t)) return Number(BigInt(t) % 4294967296n) >>> 0;
  let h = 2166136261 >>> 0;
  for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function alea(s) {
  s.rngState = (s.rngState + 0x6D2B79F5) >>> 0;
  let t = s.rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function aleaEntre(s, a, b) { return a + alea(s) * (b - a); }
function aleaInt(s, a, b) { return Math.floor(aleaEntre(s, a, b + 1 - 1e-9)); }
function choisir(s, l) { return l[Math.floor(alea(s) * l.length)]; }
function choisirPondere(s, items, poids) {
  const tot = items.reduce((a, x) => a + poids(x), 0);
  if (tot <= 0) return null;
  let r = alea(s) * tot;
  for (const x of items) { r -= poids(x); if (r <= 0) return x; }
  return items[items.length - 1];
}

// ---------- Accesseurs ----------
function dateDuTour(t) { return MOIS[t % 12] + ' ' + (ANNEE_DEPART + Math.floor(t / 12)); }
const MODS_NEUTRES = { rensBonus:0, capteursBonus:{}, opBonus:0, enveloppe:0, delaiMod:0, coutMult:1, protectionMult:1, croissanceExtMult:1, capitalMensuel:0, voteBonus:0, opinion:0, credibilite:0 };
function mods(s) { return s.doctrine ? DOC[s.doctrine].mods : MODS_NEUTRES; }
function unitesDans(s, theatre, etats) {
  const e = etats || ['deployee'];
  return UNITES.filter(u => s.unites[u.id].theatre === theatre && e.includes(s.unites[u.id].etat));
}
function nbCapteurs(s, service, theatre) {
  const a = s.services[service].affectations[theatre];
  if (!a) return 0;
  return TYPES_CAPTEURS.reduce((x, t) => x + (a[t] || 0), 0);
}
function capteursLibres(s, service, type) {
  const sv = s.services[service];
  let pris = 0;
  for (const t in sv.affectations) pris += sv.affectations[t][type] || 0;
  return sv.capteurs[type] - pris;
}
function menacesDans(s, theatre) { return s.menaces.filter(m => m.theatre === theatre); }
function menaceParId(s, id) { return s.menaces.find(m => m.id === id) || null; }
function actionsParTour(s) {
  return borner(PARAMS.actionsBase + Math.floor(s.ressources.capital / PARAMS.actionsParCapital), 1, PARAMS.actionsMax);
}
function enIndisponibilite(u, tour) {
  return (u.indisponibilites || []).some(p => tour >= p.debut && tour <= p.fin);
}
function coutMult(s) { return mods(s).coutMult; }
function probaVote(s) {
  const R = s.ressources;
  return borner(0.25 + R.opinion / 100 * 0.45 + R.capital / 100 * 0.35 + mods(s).voteBonus, 0.05, 0.97);
}
function coutsMensuels(s) {
  let c = 0;
  for (const u of UNITES) { const e = s.unites[u.id]; if (e.etat === 'deployee' || e.etat === 'projection') c += u.coutMensuel * coutMult(s); }
  return arrondi(c);
}
function fiabilite(r) { return r >= 75 ? 'A' : r >= 55 ? 'B' : r >= 35 ? 'C' : r >= 20 ? 'D' : 'E'; }
function journaliser(s, texte, genre) {
  s.journal.unshift({ tour: s.tour, texte, genre: genre || 'info' });
  if (s.journal.length > 150) s.journal.length = 150;
}
function decider(s, texte) { s.decisions.push({ tour: s.tour, texte }); }

function appuiDef(allie, appui) { return AL[allie].appuis.find(a => a.id === appui); }
const BONUS_PERIODIQUES = ['rens', 'pression', 'frappesZoom', 'recosZoom', 'opBonus', 'delai'];
function bonusTheatre(s, t) {
  const th = s.theatres[t], b = { rens: 0, pression: 0, frappesZoom: 0, recosZoom: 0, opBonus: 0, delai: 0 };
  if (th.allie > 0) { b.rens += 10; b.pression += 6; b.frappesZoom += 1; b.opBonus += 0.05; }
  for (const a of th.appuis) { const ef = appuiDef(a.allie, a.appui).effets; for (const k of BONUS_PERIODIQUES) if (ef[k]) b[k] += ef[k]; }
  b.delai = Math.max(-1, b.delai);
  return b;
}
function delaiProjection(s, uniteId, theatre) {
  return Math.max(0, UN[uniteId].delai + mods(s).delaiMod + bonusTheatre(s, theatre).delai);
}

// ---------- Renseignement ----------
function calculerRens(s) {
  const md = mods(s);
  for (const T of THEATRES) {
    const th = s.theatres[T.id];
    let r = T.rensBase + md.rensBonus + th.rensBonus + th.rensPermanent;
    for (const sv of SERVICES) {
      const a = s.services[sv.id].affectations[T.id];
      if (!a) continue;
      for (const ty of TYPES_CAPTEURS) r += (a[ty] || 0) * POIDS_CAPTEUR[ty] * sv.efficacite[ty];
    }
    for (const u of unitesDans(s, T.id)) r += u.cap.renseignement * 1.5 * (1 - s.unites[u.id].fatigue / 300);
    r += bonusTheatre(s, T.id).rens;
    th.rens = Math.round(borner(r, 0, 95));
  }
}
function rensMenace(s, m) {
  const T = MT[m.type];
  let r = s.theatres[m.theatre].rens;
  for (const sv in T.servicesCles) r += T.servicesCles[sv] * nbCapteurs(s, sv, m.theatre);
  return Math.round(borner(r, 0, 98));
}
function serviceSource(s, theatre) {
  let best = null, n = 0;
  for (const sv of SERVICES) { const c = nbCapteurs(s, sv.id, theatre); if (c > n) { n = c; best = sv.id; } }
  if (best) return best;
  return TH[theatre].exterieur ? 'DRM' : 'DGSI';
}
function estimerMenaces(s) {
  s.rapports = [];
  for (const m of s.menaces) {
    const r = rensMenace(s, m);
    if (!m.detectee) {
      const p = r / 110 + m.force / 250;
      if (alea(s) < p) m.detectee = true; else continue;
    }
    const marge = Math.max(PARAMS.margeMin, Math.round((100 - r) * 0.45));
    let bruit = (alea(s) + alea(s) - 1) * marge;
    m.rapportFaux = false;
    if (r < PARAMS.rensFauxRapport && alea(s) < 0.3) {
      bruit += (alea(s) < 0.5 ? -1 : 1) * aleaEntre(s, 15, 30);
      m.rapportFaux = true;
    }
    const prec = m.estimation;
    m.estimation = Math.round(borner(m.force + bruit, 0, 100));
    m.marge = marge;
    const tend = prec === null ? 'première évaluation' : (m.estimation - prec > 4 ? 'en hausse' : (prec - m.estimation > 4 ? 'en baisse' : 'stable'));
    s.rapports.push({ theatre: m.theatre, service: serviceSource(s, m.theatre), fiabilite: fiabilite(r),
      texte: MT[m.type].nom + ' : niveau estimé ' + m.estimation + ' (± ' + marge + '), ' + tend + '.' });
  }
  for (const T of THEATRES) {
    const th = s.theatres[T.id];
    if (th.rens < PARAMS.rensFauxRapport && alea(s) < 0.15) {
      s.rapports.push({ theatre: T.id, service: serviceSource(s, T.id), fiabilite: 'E',
        texte: 'Signalement non recoupé d’une activité suspecte. Source unique, non confirmée.' });
    }
    if (th.crise) s.rapports.push({ theatre: T.id, service: serviceSource(s, T.id), fiabilite: fiabilite(th.rens), texte: 'Crise en cours : ' + th.crise.titre + '.' });
  }
}

// ---------- Création de partie ----------
function nouvellePartie(graine, difficulte) {
  const d = DIFFICULTES[difficulte] ? difficulte : 'normal';
  const D = DIFFICULTES[d];
  const s = {
    version: 1, graine: String(graine), rngState: graineVersEntier(graine), difficulte: d, doctrine: null,
    tour: 0, phase: 'doctrine',
    ressources: { budget: D.budgetInitial, enveloppe: D.enveloppe, surcout: 0, capital: D.capital, opinion: D.opinion, menaceInt: D.menaceInt, credibilite: D.credibilite },
    actionsRestantes: 0, unites: {}, services: {}, theatres: {}, menaces: [], prochainIdMenace: 1,
    file: [], evenementCourant: null, criseCourante: null, zoom: null, dernierBilan: null, dernierResultat: null,
    chaines: [], compteurEvenements: {}, journal: [], rapports: [], decisions: [], historique: [],
    menaceInt100: 0, fin: null,
    stats: { operations: 0, succes: 0, pertes: 0, collat: 0, crisesInterv: 0, crisesReussies: 0, crisesIgnorees: 0, attaques: 0, dejoues: 0, votes: 0, votesPerdus: 0 }
  };
  for (const u of UNITES) s.unites[u.id] = { etat: u.depart ? 'deployee' : 'disponible', theatre: u.depart || null, fatigue: u.depart ? 20 : 0, compteur: 0, indispo: 0 };
  for (const sv of SERVICES) {
    s.services[sv.id] = { capteurs: Object.assign({}, sv.capteurs), affectations: {} };
    for (const t in sv.affectationInitiale) s.services[sv.id].affectations[t] = Object.assign({ HUMINT: 0, SIGINT: 0, IMINT: 0 }, sv.affectationInitiale[t]);
  }
  for (const T of THEATRES) {
    const engage = UNITES.some(u => u.depart === T.id);
    s.theatres[T.id] = { rens: 0, rensBonus: 0, rensPermanent: 0, partenaire: 0, pressionBonus: 0, pressionOps: 0,
      toursIntervention: engage ? 12 : 0, voteFait: engage, allie: 0, appuis: [], crise: null };
  }
  s.allies = {};
  for (const A of ALLIES) s.allies[A.id] = { relation: A.relation, cooldown: 0 };
  for (const T of MENACES) {
    const th = choisir(s, T.theatresDepart);
    ajouterMenace(s, T.id, th, aleaEntre(s, T.forceDepart[0], T.forceDepart[1]) * D.forceMult, true);
    for (const sec of T.secondaires) if (alea(s) < sec.p) ajouterMenace(s, T.id, sec.theatre, aleaEntre(s, sec.force[0], sec.force[1]) * D.forceMult, false);
  }
  calculerRens(s);
  estimerMenaces(s);
  journaliser(s, 'Prise de fonctions. Graine ' + s.graine + ', difficulté ' + D.nom + '.', 'info');
  return s;
}
function ajouterMenace(s, type, theatre, force, detectee) {
  const m = { id: 'M' + (s.prochainIdMenace++), type, theatre, force: Math.round(borner(force, 1, 100)), detectee: !!detectee, estimation: null, marge: 50, rapportFaux: false };
  s.menaces.push(m);
  return m;
}

// ---------- Pression exercée sur une menace ----------
function pressionMenace(s, m) {
  const T = MT[m.type], th = s.theatres[m.theatre];
  let p = 0;
  for (const u of unitesDans(s, m.theatre)) {
    const f = 1 - s.unites[u.id].fatigue / 200;
    for (const c in T.sensibilite) p += u.cap[c] * T.sensibilite[c] * f;
  }
  p += (T.sensibilite.renseignement || 0) * th.rens / 10;
  for (const sv in T.pressionServices) p += nbCapteurs(s, sv, m.theatre) * T.pressionServices[sv];
  p += th.pressionOps + th.pressionBonus + th.partenaire * 0.25 + bonusTheatre(s, m.theatre).pression;
  return Math.max(0, p);
}

// ---------- Évaluation d'une opération (aperçu, sur la base des estimations) ----------
function participantsOperation(s, op, theatre) {
  return unitesDans(s, theatre).filter(u => (op.categories.length === 0 || op.categories.includes(u.categorie)) && u.cap[op.capacite] >= op.minCapacite);
}
function evaluerOperation(s, opId, theatre, cible, reel) {
  const op = OP[opId], md = mods(s), th = s.theatres[theatre];
  const parts = participantsOperation(s, op, theatre);
  let puissance = parts.reduce((a, u) => a + u.cap[op.capacite] * (1 - s.unites[u.id].fatigue / 200), 0);
  if (op.serviceRequis) puissance += nbCapteurs(s, op.serviceRequis, theatre) * 3;
  const m = cible ? menaceParId(s, cible) : null;
  const rens = m ? rensMenace(s, m) : th.rens;
  const force = m ? (reel ? m.force : (m.estimation === null ? 50 : m.estimation)) : 30;
  const pS = borner(0.2 + Math.min(puissance, 30) * 0.025 + rens * 0.004 - force * 0.005 + md.opBonus + bonusTheatre(s, theatre).opBonus, 0.05, 0.95);
  const discr = parts.length ? parts.reduce((a, u) => a + u.cap.discretion, 0) / parts.length : 5;
  const pP = borner(op.risquePertes * (1.4 - discr / 10) * (0.5 + force / 100), 0, 0.9);
  const pC = borner(op.risqueCollat * (1.3 - rens / 100), 0, 0.9);
  return { pSucces: pS, risquePertes: pP, risqueCollat: pC, cout: arrondi(op.cout * md.coutMult), capital: op.capital, participants: parts.map(u => u.id), puissance: arrondi(puissance) };
}

// ---------- Moyens mobilisables pour une crise ----------
function moyensCrise(s, theatre) {
  const T = TH[theatre];
  if (T.carteRegionale) {
    const fs = unitesDans(s, theatre).filter(u => u.categorie === 'FS');
    const fsDispo = UNITES.filter(u => u.categorie === 'FS' && s.unites[u.id].etat === 'disponible' && u.theatres.includes(theatre) && !enIndisponibilite(u, s.tour));
    const frappe = unitesDans(s, theatre).filter(u => u.cap.frappe >= 5 && u.categorie !== 'FS');
    return { zoom: true, fs: fs.map(u => u.id), fsDispo: fsDispo.map(u => u.id), frappe: frappe.map(u => u.id), possible: fs.length + fsDispo.length > 0 };
  }
  const sur = unitesDans(s, theatre);
  const dispo = UNITES.filter(u => s.unites[u.id].etat === 'disponible' && u.theatres.includes(theatre) && !enIndisponibilite(u, s.tour) && (u.cap.assaut >= 5 || u.cap.frappe >= 5));
  return { zoom: false, sur: sur.map(u => u.id), dispo: dispo.map(u => u.id), possible: sur.length + dispo.length > 0 };
}

function evaluerCriseAbstraite(s, theatre, reel) {
  const moy = moyensCrise(s, theatre), th = s.theatres[theatre];
  let ids = (moy.sur || []).slice(), urgence = null;
  if (!ids.length && moy.dispo && moy.dispo.length) { urgence = moy.dispo[0]; ids = [urgence]; }
  const m = menaceDeCrise(s, theatre);
  const force = m ? (reel ? m.force : (m.estimation === null ? 50 : m.estimation)) : 30;
  const power = ids.reduce((x, id) => x + Math.max(UN[id].cap.assaut, UN[id].cap.frappe) * (1 - s.unites[id].fatigue / 200), 0);
  return { pSucces: borner(0.3 + power * 0.03 + th.rens * 0.003 - force * 0.004 + mods(s).opBonus, 0.1, 0.9), risquePertes: 0.15, unites: ids, urgence };
}

// ---------- Actions possibles ----------
function actionsPossibles(s) {
  const L = [];
  if (s.fin) return L;
  if (s.phase === 'doctrine') { for (const d of DOCTRINES) L.push({ type: 'DOCTRINE', id: d.id }); return L; }
  if (s.phase === 'evenement') {
    const E = EV[s.evenementCourant];
    E.choix.forEach((c, i) => { if (choixPermis(s, c)) L.push({ type: 'CHOIX', index: i }); });
    return L;
  }
  if (s.phase === 'crise') {
    if (moyensCrise(s, s.criseCourante).possible) L.push({ type: 'CRISE', intervenir: true });
    L.push({ type: 'CRISE', intervenir: false });
    return L;
  }
  if (s.phase === 'zoom') return actionsZoom(s);
  if (s.phase !== 'jeu') return L;

  const R = s.ressources;
  for (const sv of SERVICES) for (const t of sv.theatres) for (const ty of TYPES_CAPTEURS) {
    if (s.services[sv.id].capteurs[ty] <= 0) continue;
    if (capteursLibres(s, sv.id, ty) > 0) L.push({ type: 'CAPTEUR', service: sv.id, theatre: t, capteur: ty, delta: 1 });
    const a = s.services[sv.id].affectations[t];
    if (a && a[ty] > 0) L.push({ type: 'CAPTEUR', service: sv.id, theatre: t, capteur: ty, delta: -1 });
  }
  if (s.actionsRestantes <= 0) return L;
  for (const u of UNITES) {
    const e = s.unites[u.id];
    if (e.etat === 'disponible' && !enIndisponibilite(u, s.tour)) for (const t of u.theatres) L.push({ type: 'DEPLOYER', unite: u.id, theatre: t });
    if (e.etat === 'deployee' || e.etat === 'projection') L.push({ type: 'RAPATRIER', unite: u.id });
  }
  for (const op of OPERATIONS) {
    if (R.capital <= op.capital) continue;
    for (const T of THEATRES) {
      if (op.theatresInterdits.includes(T.id)) continue;
      if (op.serviceRequis && nbCapteurs(s, op.serviceRequis, T.id) === 0) continue;
      if (!op.serviceRequis && participantsOperation(s, op, T.id).length === 0) continue;
      if (op.cibles === null) L.push({ type: 'OPERATION', op: op.id, theatre: T.id, cible: null });
      else for (const m of menacesDans(s, T.id)) if (m.detectee && op.cibles.includes(m.type)) L.push({ type: 'OPERATION', op: op.id, theatre: T.id, cible: m.id });
    }
  }
  if (R.capital > 8) L.push({ type: 'BUDGET', sens: 'hausse' });
  if (R.enveloppe > 20) L.push({ type: 'BUDGET', sens: 'baisse' });
  for (const A of ALLIES) {
    if (s.allies[A.id].cooldown > 0) continue;
    for (const ap of A.appuis) {
      if (R.capital <= ap.capital) continue;
      for (const t of ap.theatres) if (!s.theatres[t].appuis.some(x => x.allie === A.id && x.appui === ap.id)) L.push({ type: 'ALLIE', allie: A.id, appui: ap.id, theatre: t });
    }
  }
  return L;
}
function choixPermis(s, c) {
  if (!c.requiert) return true;
  if (c.requiert.categorie) return UNITES.some(u => u.categorie === c.requiert.categorie && ['disponible', 'deployee'].includes(s.unites[u.id].etat));
  return true;
}

// ---------- Application d'une action ----------
function appliquerAction(s, a) {
  const k = cleAction(a);
  if (!actionsPossibles(s).some(p => cleAction(p) === k)) throw new Error('Action non autorisée dans l’état courant : ' + k);
  const n = cloner(s);
  n.dernierResultat = null;
  switch (a.type) {
    case 'DOCTRINE': actDoctrine(n, a); break;
    case 'CAPTEUR': actCapteur(n, a); break;
    case 'DEPLOYER': actDeployer(n, a); break;
    case 'RAPATRIER': actRapatrier(n, a); break;
    case 'OPERATION': actOperation(n, a); break;
    case 'BUDGET': actBudget(n, a); break;
    case 'ALLIE': actAllie(n, a); break;
    case 'CHOIX': actChoix(n, a); break;
    case 'CRISE': actCrise(n, a); break;
    default: actZoom(n, a);
  }
  const f = evaluerFin(n);
  if (f.fini && f.type === 'defaite') terminer(n, f);
  return n;
}

function actDoctrine(s, a) {
  const D = DOC[a.id], md = D.mods;
  s.doctrine = a.id;
  s.ressources.enveloppe += md.enveloppe;
  s.ressources.opinion = borner(s.ressources.opinion + md.opinion, 0, 100);
  s.ressources.credibilite = borner(s.ressources.credibilite + md.credibilite, 0, 100);
  for (const sv in md.capteursBonus) for (const ty in md.capteursBonus[sv]) s.services[sv].capteurs[ty] += md.capteursBonus[sv][ty];
  s.phase = 'jeu';
  s.actionsRestantes = actionsParTour(s);
  calculerRens(s);
  decider(s, 'Doctrine retenue : ' + D.nom + '.');
  journaliser(s, 'Doctrine retenue : ' + D.nom + '.', 'decision');
}
function actCapteur(s, a) {
  const aff = s.services[a.service].affectations;
  if (!aff[a.theatre]) aff[a.theatre] = { HUMINT: 0, SIGINT: 0, IMINT: 0 };

  if (c.deploiementExterieur && !UNITES.some(u => s.unites[u.id].etat === 'deployee' && TH[s.unites[u.id].theatre].exterieur)) return false;

// ---------- Zoom régional : moteur générique piloté par CARTES_REGIONALES ----------

  const recosMax = 1 + unitesDans(s, theatre).filter(u => u.cap.renseignement >= 8).length + bonusTheatre(s, theatre).recosZoom;
  s.zoom = {
    carte: C.id, theatre, scenario: sc.id, titre: sc.titre, semaine: 1, maxSemaines: 6, lieux,
    unites: fsIds.map(id => ({ id, lieu: C.depart, blesse: false, aAgi: false })),
    frappesMax, frappes: frappesMax, recosMax, recos: recosMax, appui: 1,
    forceLocale: Math.round(C.forceLocale.force + th.partenaire * 0.5), reserve,

function majEstimationsZoom(s) {

    const L = z.lieux[id];
    if (L.controle === 'ennemi' && L.revele) L.estimee = Math.round(borner(L.force + (alea(s) * 2 - 1) * L.marge, 0, 150));

function actionsZoom(s) {
  const z = s.zoom, C = CARTES_REGIONALES[z.carte], L = [];
  for (const u of z.unites) {
    if (u.aAgi) continue;
    for (const v of voisinsLieu(C, u.lieu)) if (z.lieux[v].controle !== 'ennemi') L.push({ type: 'Z_DEPLACER', unite: u.id, vers: v });
    if (!u.blesse) for (const v of [u.lieu].concat(voisinsLieu(C, u.lieu))) if (z.lieux[v].controle === 'ennemi' && z.lieux[v].force > 0) L.push({ type: 'Z_RAID', unite: u.id, lieu: v });

      if (l.controle === 'neutre' && z.appui > 0 && z.forceLocale > 10 && voisinsLieu(C, id).some(v => z.lieux[v].controle === 'allie')) L.push({ type: 'Z_APPUI', lieu: id });

function finDeTour(s) {
  if (s.phase !== 'jeu' || s.fin) return s;
  const n = cloner(s);
  const R = n.ressources, md = mods(n), D = DIFFICULTES[n.difficulte];
  n.dernierResultat = null; n.dernierBilan = null;

  // 1. Budget

    R.capital = borner(R.capital - pen, 0, 100);
    journaliser(n, 'Dépassement de l’enveloppe : ' + arrondi(-R.budget) + ' M€ de surcoût OPEX (capital -' + pen + ').', 'alerte');

  }

  // 2. Unités
  for (const u of UNITES) {
    const e = n.unites[u.id];
    if (enIndisponibilite(u, n.tour + 1)) {
      if (e.etat === 'deployee' || e.etat === 'projection') rapatrier(n, u.id, 'arrêt technique programmé');

      continue;
    }
    if (e.etat === 'projection') { e.compteur--; if (e.compteur <= 0) { e.etat = 'deployee'; journaliser(n, u.nom + ' opérationnel sur le théâtre ' + TH[e.theatre].nom + '.', 'info'); } continue; }
    if (e.etat === 'deployee') {
      e.fatigue = borner(e.fatigue + PARAMS.fatigueDeploiement * (10 - u.cap.endurance) / 5 + 1, 0, 100);
      if (e.fatigue >= 100) rapatrier(n, u.id, 'usure, relève impérative');
      continue;

    if (e.etat === 'regeneration') { e.fatigue = borner(e.fatigue - 20, 0, 100); e.compteur--; if (e.compteur <= 0) e.etat = 'disponible'; continue; }

  }

  for (const T of THEATRES) {
    if (!T.exterieur || T.basePermanente) continue;
    const th = n.theatres[T.id];
    if (unitesDans(n, T.id, ['deployee', 'projection']).length) {
      th.toursIntervention++;
      if (th.toursIntervention > PARAMS.dureeAvantVote && !th.voteFait) {
        const p = probaVote(n);
        n.stats.votes++;
        if (alea(n) < p) {
          th.voteFait = true; R.capital = borner(R.capital + 3, 0, 100);
          const t = 'Article 35 : le Parlement autorise la prolongation de l’intervention (' + T.nom + ').';
          journaliser(n, t, 'succes'); decider(n, t);
        } else {
          n.stats.votesPerdus++;
          for (const u of unitesDans(n, T.id, ['deployee', 'projection'])) rapatrier(n, u.id, 'vote négatif du Parlement');
          R.capital = borner(R.capital - 10, 0, 100); R.credibilite = borner(R.credibilite - 5, 0, 100);
          th.toursIntervention = 0;
          const t = 'Article 35 : le Parlement refuse la prolongation (' + T.nom + '). Retrait des forces.';

  // 6. Opinion, crédibilité, capital

  R.opinion = borner(Math.round((R.opinion + (50 - R.opinion) * PARAMS.opinionRappel - Math.max(0, R.menaceInt - 55) * 0.1 - Math.max(0, nbExt - 3) * 0.5) * 10) / 10, 0, 100);

    const st = n.allies[A.id];
    const engage = A.interets.filter(t => unitesDans(n, t).length > 0).length;
    st.relation = borner(Math.round((st.relation + (A.relation - st.relation) * 0.05 + engage * 0.4 + (R.credibilite - 50) * 0.01) * 10) / 10, 0, 100);
    if (st.cooldown > 0) st.cooldown--;
  }

  // 8. Historique, passage au mois suivant
  n.historique.push(instantane(n));
  n.tour++;
  calculerRens(n);
  estimerMenaces(n);

  // 9. Fin de partie ?
  const f = evaluerFin(n);
  if (f.fini) { terminer(n, f); return n; }

  // 10. Événements (chaînes puis tirage pondéré)
  const dues = n.chaines.filter(c => c.tour <= n.tour);
  n.chaines = n.chaines.filter(c => c.tour > n.tour);
  for (const c of dues) if ((n.compteurEvenements[c.id] || 0) < (EV[c.id].max || 1)) n.file.push({ kind: 'evenement', id: c.id });
  if (alea(n) < PARAMS.probaEvenement) {
    const elig = EVENEMENTS.filter(E => E.poids > 0 && conditionsRemplies(n, E) && !n.file.some(f => f.id === E.id));
    const E = choisirPondere(n, elig, x => x.poids);
    if (E) n.file.push({ kind: 'evenement', id: E.id });

  avancerFile(n);

}
function instantane(s) {
  const ext = s.menaces.filter(m => TH[m.theatre].exterieur);
  return {
    tour: s.tour, opinion: s.ressources.opinion, capital: s.ressources.capital, menaceInt: s.ressources.menaceInt,
    credibilite: s.ressources.credibilite, surcout: s.ressources.surcout,
    menaceExt: ext.length ? Math.round(ext.reduce((a, m) => a + m.force, 0) / ext.length) : 0,
    rens: Math.round(THEATRES.reduce((a, T) => a + s.theatres[T.id].rens, 0) / THEATRES.length)
  };
}

// ---------- Fin de partie ----------
function evaluerFin(s) {
  const R = s.ressources;
  if (R.opinion < 10) return { fini: true, type: 'defaite', raison: 'Le soutien de l’opinion s’est effondré (sous 10). Le gouvernement est contraint de démissionner.' };
  if (R.capital <= 0) return { fini: true, type: 'defaite', raison: 'Le capital politique est épuisé. Vous n’avez plus les moyens de gouverner.' };
  if (s.menaceInt100 >= 3) return { fini: true, type: 'defaite', raison: 'La menace intérieure est restée à son maximum pendant trois mois consécutifs.' };
  if (s.tour >= NB_TOURS) return { fini: true, type: 'bilan', raison: 'Fin du mandat de la démonstration (décembre 2017).' };
  return { fini: false };
}
function calculerScore(s) {
  const h = s.historique.length ? s.historique : [instantane(s)];
  const moy = k => h.reduce((a, x) => a + x[k], 0) / h.length;
  const ext = s.menaces.filter(m => TH[m.theatre].exterieur);
  const extFinal = ext.length ? ext.reduce((a, m) => a + m.force, 0) / ext.length : 0;
  const crises = s.stats.crisesInterv ? s.stats.crisesReussies / s.stats.crisesInterv : 0.5;
  const domaines = [
    { nom: 'Sécurité intérieure', valeur: Math.round(100 - moy('menaceInt')), poids: 0.25 },
    { nom: 'Opérations extérieures', valeur: Math.round(borner(100 - extFinal + (crises - 0.5) * 20, 0, 100)), poids: 0.25 },
    { nom: 'Renseignement', valeur: Math.round(moy('rens')), poids: 0.15 },
    { nom: 'Politique intérieure', valeur: Math.round((moy('opinion') + s.ressources.capital) / 2), poids: 0.15 },
    { nom: 'Crédibilité et alliances', valeur: Math.round(moy('credibilite') * 0.7 + ALLIES.reduce((a, A) => a + s.allies[A.id].relation, 0) / ALLIES.length * 0.3), poids: 0.1 },
    { nom: 'Maîtrise budgétaire', valeur: Math.round(borner(100 - s.ressources.surcout / 5, 0, 100)), poids: 0.1 }
  ];
  let total = Math.round(domaines.reduce((a, d) => a + d.valeur * d.poids, 0));
  if (s.fin && s.fin.type === 'defaite') total = Math.round(total * 0.5);
  const mention = total >= 70 ? 'Remarquable' : total >= 55 ? 'Satisfaisant' : total >= 40 ? 'Mitigé' : 'Insuffisant';
  return { domaines, total, mention };
}
function terminer(s, f) {
  s.fin = { type: f.type, raison: f.raison, tour: s.tour };
  s.fin.score = calculerScore(s);
  s.phase = 'fin';
  s.zoom = null;
  journaliser(s, (f.type === 'defaite' ? 'Défaite : ' : 'Fin de partie : ') + f.raison, f.type === 'defaite' ? 'alerte' : 'succes');
}

// ---------- Outils de débogage (purs) ----------
function forcerEvenement(s, id) {
  if (!EV[id] || s.fin) return s;
  const n = cloner(s);
  n.file.unshift({ kind: 'evenement', id });

}
function changerGraine(s, g) {

}

// ---------- Contrôle de cohérence des données ----------
// Permet d'ajouter pays, théâtres ou unités dans la couche DONNÉES en étant prévenu des références cassées.
function verifierDonnees() {
  const err = [];
  const ids = (l, nom) => { const v = {}; for (const x of l) { if (v[x.id]) err.push(nom + ' : identifiant en double ' + x.id); v[x.id] = 1; } };
  ids(THEATRES, 'THEATRES'); ids(UNITES, 'UNITES'); ids(SERVICES, 'SERVICES'); ids(MENACES, 'MENACES'); ids(EVENEMENTS, 'EVENEMENTS'); ids(ALLIES, 'ALLIES');
  const th = t => TH[t] !== undefined;
  for (const T of THEATRES) for (const v of T.voisins) { if (!th(v)) err.push('Théâtre ' + T.id + ' : voisin inconnu ' + v); else if (!TH[v].voisins.includes(T.id)) err.push('Théâtre ' + T.id + ' : liaison non réciproque avec ' + v); }
  for (const T of THEATRES) if (T.carteRegionale && !CARTES_REGIONALES[T.carteRegionale]) err.push('Théâtre ' + T.id + ' : carte régionale inconnue');
  for (const u of UNITES) { for (const t of u.theatres) if (!th(t)) err.push('Unité ' + u.id + ' : théâtre inconnu ' + t); if (!CATEGORIES[u.categorie]) err.push('Unité ' + u.id + ' : catégorie inconnue'); if (u.depart && !u.theatres.includes(u.depart)) err.push('Unité ' + u.id + ' : théâtre de départ non accessible'); }
  for (const sv of SERVICES) { for (const t of sv.theatres) if (!th(t)) err.push('Service ' + sv.id + ' : théâtre inconnu ' + t); for (const t in sv.affectationInitiale) if (!sv.theatres.includes(t)) err.push('Service ' + sv.id + ' : affectation hors périmètre ' + t); }
  for (const m of MENACES) { for (const t of m.theatresDepart.concat(m.expansion)) if (!th(t)) err.push('Menace ' + m.id + ' : théâtre inconnu ' + t); for (const t in m.alimentePar) if (!MT[t]) err.push('Menace ' + m.id + ' : alimentation par type inconnu ' + t); }
  for (const o of OPERATIONS) for (const c of (o.cibles || [])) if (!MT[c]) err.push('Opération ' + o.id + ' : cible inconnue ' + c);
  for (const A of ALLIES) for (const ap of A.appuis) for (const t of ap.theatres) if (!th(t)) err.push('Allié ' + A.id + '/' + ap.id + ' : théâtre inconnu ' + t);
  const verifEffets = (e, ou) => {
    if (!e) return;
    for (const x of (e.menace || [])) if (!MT[x.type]) err.push(ou + ' : menace inconnue ' + x.type);
    for (const k of ['rens', 'partenaire', 'pression']) for (const x of (e[k] || [])) if (!th(x.theatre)) err.push(ou + ' : théâtre inconnu ' + x.theatre);
    for (const x of (e.fatigue || [])) if ((x.unite && !UN[x.unite]) || (x.categorie && !CATEGORIES[x.categorie])) err.push(ou + ' : unité ou catégorie inconnue');
    if (e.indispo && !UN[e.indispo.unite]) err.push(ou + ' : unité inconnue ' + e.indispo.unite);
    for (const x of (e.relation || [])) if (!AL[x.allie]) err.push(ou + ' : allié inconnu ' + x.allie);
    if (e.appui && (!AL[e.appui.allie] || !appuiDef(e.appui.allie, e.appui.appui))) err.push(ou + ' : appui inconnu');
    if (e.crise && !th(e.crise) && !MT[e.crise]) err.push(ou + ' : crise sur cible inconnue ' + e.crise);
    if (e.alea) { verifEffets(e.alea.succes, ou); verifEffets(e.alea.echec, ou); }
  };
  for (const E of EVENEMENTS) {
    if (!E.choix || E.choix.length < 2 || E.choix.length > 3) err.push('Événement ' + E.id + ' : 2 ou 3 choix attendus');
    if (E.choix.every(c => c.requiert)) err.push('Événement ' + E.id + ' : au moins un choix doit être toujours possible');
    for (const c of E.choix) { verifEffets(c.effets, 'Événement ' + E.id); if (c.suite && !EV[c.suite]) err.push('Événement ' + E.id + ' : suite inconnue ' + c.suite); }
    const k = E.cond || {};
    if (k.menace && !MT[k.menace.type]) err.push('Événement ' + E.id + ' : condition sur menace inconnue');
    for (const r of [k.relationMin, k.relationMax]) if (r && !AL[r.allie]) err.push('Événement ' + E.id + ' : condition sur allié inconnu');
  }
  for (const id in CARTES_REGIONALES) {
    const C = CARTES_REGIONALES[id], L = {};
    for (const l of C.lieux) L[l.id] = l;
    if (!L[C.depart]) err.push('Carte ' + id + ' : lieu de départ inconnu');
    for (const [a, b] of C.liens) if (!L[a] || !L[b]) err.push('Carte ' + id + ' : lien vers un lieu inconnu ' + a + '-' + b);
    for (const sc of C.scenarios) for (const o of sc.objectifs) if (o.lieu && !L[o.lieu]) err.push('Carte ' + id + ' : objectif sur lieu inconnu ' + o.lieu);
    if (C.lieux.length < 8 || C.lieux.length > 12) err.push('Carte ' + id + ' : 8 à 12 lieux attendus');
  }
  return err;
}
// Complète une sauvegarde issue d'une version antérieure ou d'un jeu de données enrichi (fonction pure)
function migrerEtat(s0) {
  const s = cloner(s0);
  if (!s.allies) s.allies = {};
  for (const A of ALLIES) if (!s.allies[A.id]) s.allies[A.id] = { relation: A.relation, cooldown: 0 };
  for (const T of THEATRES) {
    if (!s.theatres[T.id]) s.theatres[T.id] = { rens: 0, rensBonus: 0, rensPermanent: 0, partenaire: 0, pressionBonus: 0, pressionOps: 0, toursIntervention: 0, voteFait: false, allie: 0, appuis: [], crise: null };
    if (!s.theatres[T.id].appuis) s.theatres[T.id].appuis = [];
    delete s.theatres[T.id].allieCooldown;
  }
  for (const u of UNITES) if (!s.unites[u.id]) s.unites[u.id] = { etat: 'disponible', theatre: null, fatigue: 0, compteur: 0, indispo: 0 };
  for (const sv of SERVICES) if (!s.services[sv.id]) s.services[sv.id] = { capteurs: Object.assign({}, sv.capteurs), affectations: {} };
  for (const j of s.journal) delete j.date;
  for (const d of s.decisions) delete d.date;
  calculerRens(s);

// ---------- Simulation automatique de parties (console) ----------
function verifierInvariants(s, complet) {
  const err = [];
  const R = s.ressources;
  for (const k of ['opinion', 'capital', 'menaceInt', 'credibilite']) if (!(R[k] >= 0 && R[k] <= 100)) err.push(k + ' hors bornes : ' + R[k]);
  for (const k of ['budget', 'enveloppe', 'surcout']) if (!Number.isFinite(R[k])) err.push(k + ' invalide');
  for (const m of s.menaces) if (!(m.force > 0 && m.force <= 100)) err.push('force de menace invalide ' + m.id + ' : ' + m.force);
  for (const u of UNITES) {
    const e = s.unites[u.id];
    if (!ETATS_UNITE[e.etat]) err.push('état inconnu ' + u.id);
    if ((e.etat === 'deployee' || e.etat === 'projection') && !TH[e.theatre]) err.push('unité sans théâtre ' + u.id);
    if (!(e.fatigue >= 0 && e.fatigue <= 100)) err.push('fatigue invalide ' + u.id);
  }
  for (const sv of SERVICES) for (const ty of TYPES_CAPTEURS) if (capteursLibres(s, sv.id, ty) < 0) err.push('capteurs négatifs ' + sv.id);
  for (const A of ALLIES) if (!(s.allies[A.id].relation >= 0 && s.allies[A.id].relation <= 100)) err.push('relation invalide ' + A.id);
  for (const T of THEATRES) for (const a of s.theatres[T.id].appuis) if (!(a.tours > 0) || !appuiDef(a.allie, a.appui)) err.push('appui invalide ' + T.id);
  const j = complet ? JSON.stringify(s) : null;
  if (complet && JSON.stringify(JSON.parse(j)) !== j) err.push('état non sérialisable');
  if (!s.fin && actionsPossibles(s).length === 0 && s.phase !== 'jeu') err.push('blocage : aucune action en phase ' + s.phase);
  return err;
}
function simuler(nbParties) {
  const N = nbParties || 200;
  const t0 = Date.now();
  const choix = { rngState: 987654321 };
  const pick = l => l[Math.floor(alea(choix) * l.length)];
  const res = { parties: N, erreurs: 0, fins: {}, dureeMoyenne: 0, scoreMoyen: 0, messages: [] };
  const ed = verifierDonnees();
  if (ed.length) { res.erreurs += ed.length; res.messages.push('Données : ' + ed.join(' ; ')); }
  let cumulTours = 0, cumulScore = 0;
  const diffs = Object.keys(DIFFICULTES);
  for (let i = 0; i < N; i++) {
    try {
      let s = nouvellePartie(1000 + i, diffs[i % diffs.length]);
      let garde = 0;
      while (!s.fin && garde++ < 6000) {
        if (s.phase === 'jeu') {
          const nb = Math.floor(alea(choix) * 5);
          for (let k = 0; k < nb && s.phase === 'jeu' && !s.fin; k++) {
            const L = actionsPossibles(s);
            const groupes = {};
            for (const a of L) (groupes[a.type] = groupes[a.type] || []).push(a);
            const types = Object.keys(groupes);
            if (!types.length) break;
            s = appliquerAction(s, pick(groupes[pick(types)]));
          }
          if (s.phase === 'jeu' && !s.fin) s = finDeTour(s);
        } else {
          const L = actionsPossibles(s);
          let a = pick(L);
          if (s.phase === 'zoom' && a.type === 'Z_RETRAIT' && alea(choix) < 0.9) a = { type: 'Z_SEMAINE' };
          s = appliquerAction(s, a);
        }
        const inv = verifierInvariants(s, s.phase === 'jeu' || !!s.fin);
        if (inv.length) { res.erreurs += inv.length; if (res.messages.length < 20) res.messages.push('Partie ' + i + ' : ' + inv.join(' ; ')); break; }
      }
      if (!s.fin) { res.erreurs++; if (res.messages.length < 20) res.messages.push('Partie ' + i + ' : non terminée'); continue; }
      const cle = s.fin.type === 'bilan' ? 'bilan (tour 36)' : 'défaite : ' + (s.ressources.opinion < 10 ? 'opinion' : s.ressources.capital <= 0 ? 'capital' : 'menace intérieure');
      res.fins[cle] = (res.fins[cle] || 0) + 1;
      cumulTours += s.tour; cumulScore += s.fin.score.total;
    } catch (e) {
      res.erreurs++;
      if (res.messages.length < 20) res.messages.push('Partie ' + i + ' : ' + e.message);
    }
  }
  const finies = Object.values(res.fins).reduce((x, y) => x + y, 0);
  res.dureeMoyenne = arrondi(cumulTours / Math.max(1, finies));
  res.scoreMoyen = arrondi(cumulScore / Math.max(1, finies));
  res.tempsMs = Date.now() - t0;
  console.log('Simulation de ' + N + ' parties — erreurs : ' + res.erreurs + ', durée moyenne : ' + res.dureeMoyenne + ' tours, score moyen : ' + res.scoreMoyen + ', ' + res.tempsMs + ' ms');
  console.table(res.fins);
  if (res.messages.length) console.log(res.messages.join('\n'));
  return res;
}

const $ = id => document.getElementById(id);
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function attrAction(a) { return ' data-act="' + esc(JSON.stringify(a)) + '"'; }

function possibles() { return state ? actionsPossibles(state) : []; }

// ---------- Envoi d'actions ----------
function jouer(a) {

// ---------- Libellés ----------
function libelleAction(a) {

    case 'RAPATRIER': return 'Rapatrier ' + UN[a.unite].nom;

    case 'BUDGET': return a.sens === 'hausse' ? 'Demander une rallonge (+10 M€/mois, capital -8)' : 'Réduire l’enveloppe (-10 M€/mois, capital +4)';

function niveauAffiche(t) {
  const ms = state.menaces.filter(m => m.theatre === t && m.detectee);

  return ms.reduce((a, m) => m.estimation > a.estimation ? m : a);
}

  for (const s of ['hausse', 'baisse']) { const a = { type: 'BUDGET', sens: s }; gouv += '<div class="ligne"><button' + attrAction(a) + (estPossible(P, a) ? '' : ' disabled') + '>' + libelleAction(a) + '</button></div>'; }
  gouv += '<p class="pale">Actions restantes : ' + state.actionsRestantes + '. Opérations menées : ' + state.stats.operations + ' (' + state.stats.succes + ' succès).</p></div>';

function blocCapteurs(svId, theatre, P) {

function panneauTheatre(t, P) {

  for (const a of eng) { const u = UN[a.unite]; h += '<div class="ligne"><span class="g">' + esc(u.nom) + ' <span class="pale">' + delaiProjection(state, u.id, t) + ' m · ' + (u.coutDeploiement * coutMult(state)).toFixed(1) + ' + ' + (u.coutMensuel * coutMult(state)).toFixed(1) + '/m</span></span><button' + attrAction(a) + '>Engager</button></div>'; }
  h += '</div><div class="bloc"><h3>Opérations</h3>';

  for (const a of ops) h += '<div class="ligne"><span class="g"' + tip(OP[a.op].description) + '>' + esc(libelleAction(a)) + '</span><button data-apercu="' + esc(JSON.stringify(a)) + '">Évaluer</button></div>';

  if (offres.length) {

function panneauUnite(id, P) {

function ligneAppui(A, ap, t, P, avecNom) {
  const a = { type: 'ALLIE', allie: A.id, appui: ap.id, theatre: t }, ok = estPossible(P, a);
  const ev = evaluerAppui(state, A.id, ap.id, t);
  const eff = decrireAppui(ap);
  return '<div class="ligne"><span class="g"' + tip(ap.nom + '\nEffets : ' + eff + (ap.duree > 1 ? ' pendant ' + ap.duree + ' mois' : '') + '\nCoût : ' + ap.capital + ' de capital, relation -' + ap.relation + ' si accordé\nProbabilité d’accord : ' + pct(ev.pSucces) + ' (relation, crédibilité, intérêt du pays pour le théâtre)') + '>' +
    esc(avecNom ? A.nom + ' : ' + ap.nom : TH[t].court) + ' <span class="pale">' + pct(ev.pSucces) + '</span></span><button' + attrAction(a) + (ok ? '' : ' disabled') + '>Demander</button></div>';
}
function decrireAppui(ap) {
  const e = ap.effets, r = [];
  if (e.rens) r.push('renseignement +' + e.rens);
  if (e.pression) r.push('pression +' + e.pression);
  if (e.opBonus) r.push('opérations +' + Math.round(e.opBonus * 100) + ' %');
  if (e.frappesZoom) r.push('frappes en zoom +' + e.frappesZoom);
  if (e.recosZoom) r.push('reconnaissances en zoom +' + e.recosZoom);
  if (e.delai) r.push('projection ' + e.delai + ' mois');
  if (e.partenaire) r.push('capacité partenaire +' + e.partenaire);
  return r.join(', ');
}
function panneauAllie(id, P) {

}
function libelleZoom(a) {
  const z = state.zoom;
  switch (a.type) {
    case 'Z_DEPLACER': return 'Déplacer ' + UN[a.unite].nom + ' vers ' + nomLieu(z, a.vers);
    case 'Z_RAID': return 'Raid de ' + UN[a.unite].nom + ' sur ' + nomLieu(z, a.lieu);
    case 'Z_EVACUER': return 'Évacuation par ' + UN[a.unite].nom + ' depuis ' + nomLieu(z, a.lieu);
    case 'Z_RECO': return 'Reconnaissance par drone sur ' + nomLieu(z, a.lieu);
    case 'Z_FRAPPE': return 'Frappe aérienne sur ' + nomLieu(z, a.lieu);
    case 'Z_APPUI': return 'Appui à l’offensive locale sur ' + nomLieu(z, a.lieu);
    default: return a.type;
  }
}
function panneauZoomActions(P) {
  const l = ui.zoomLieu, u = ui.zoomUnite;
  let h = '<h2>Actions locales' + (l ? ' — ' + esc(nomLieu(state.zoom, l)) : '') + (u ? ' — ' + esc(UN[u].nom) : '') + '</h2>';
  const liste = P.filter(a => a.type !== 'Z_SEMAINE' && a.type !== 'Z_RETRAIT' && ((u && a.unite === u) || (l && (a.lieu === l || a.vers === l))));
  if (!l && !u) h += '<p class="pale">Sélectionnez un lieu ou un détachement. Les raids partent du lieu occupé vers un lieu adjacent ; les frappes et reconnaissances visent tout lieu tenu par l’adversaire ; l’appui local vise un lieu adjacent à une position alliée.</p>';
  else if (!liste.length) h += '<p class="pale">Aucune action possible pour cette sélection cette semaine.</p>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
  for (const a of liste) {
    let t = '';
    if (a.type === 'Z_RAID') t = 'Réussite plus probable si la position est reconnue. Échec : risque de blessés.';
    if (a.type === 'Z_FRAPPE') t = 'Efficacité réduite si la position n’est pas reconnue ou si l’adversaire est dispersé. Risque collatéral selon la densité civile.';
    if (a.type === 'Z_APPUI') t = 'Les forces locales attaquent, appuyées par les détachements au contact. Seul moyen de reprendre durablement un lieu.';
    if (a.type === 'Z_RECO') t = 'Révèle la position et resserre l’estimation (marge 5). Réduit la dispersion.';
    const ev = evaluerActionZoom(state, a, false);
    let suff = '';
    if (ev && a.type === 'Z_FRAPPE') { suff = ' (dégâts ' + ev.degatsMin + '-' + ev.degatsMax + ', collatéral ' + pct(ev.risqueCollat) + ')'; }
    else if (ev) { suff = ' (' + pct(ev.pSucces) + ')'; t += '\nSuccès estimé ' + pct(ev.pSucces) + (ev.risquePertes ? ' · risque de blessés ' + pct(ev.risquePertes) : '') + (ev.risqueCollat ? ' · risque collatéral ' + pct(ev.risqueCollat) : '') + '\nEstimation fondée sur le renseignement disponible.'; }
    h += '<button' + attrAction(a) + (t ? tip(t) : '') + '>' + esc(libelleZoom(a) + suff) + '</button>';
  }
  return h + '</div>';
}

// ---------- Situation, graphiques, effets, aide ----------
function panneauSituation() {
  let h = '<div class="bloc"><h2>Tendances</h2>' + graphique(state.historique.concat([instantane(state)]), 430, 150) + '</div>';
  const ech = [];
  for (const T of THEATRES) {
    const th = state.theatres[T.id];
    if (T.exterieur && !T.basePermanente && !th.voteFait && th.toursIntervention > 0) {
      const dans = Math.max(1, PARAMS.dureeAvantVote + 1 - th.toursIntervention);
      ech.push([dans, (dans === 1 ? '<span class="ambre">' : '<span>') + 'Vote article 35 (' + T.court + ') dans ' + dans + ' mois — adoption estimée ' + pct(probaVote(state)) + '</span>']);
    }
    if (th.crise && th.crise.statut === 'libre') ech.push([0, '<span class="rouge">Crise non traitée : ' + esc(th.crise.titre) + ' (' + th.crise.toursLibres + ' mois)</span>']);
    if (th.allie) ech.push([th.allie, 'Appui allié ' + T.court + ' : encore ' + th.allie + ' mois']);
    for (const a of th.appuis) ech.push([a.tours, '<span class="violet">' + esc(AL[a.allie].nom + ' — ' + appuiDef(a.allie, a.appui).nom) + ' (' + T.court + ') : ' + a.tours + ' mois</span>']);
  }
  for (const u of UNITES) {
    const e = state.unites[u.id];
    if (e.etat === 'projection') ech.push([e.compteur, u.nom + ' arrive sur ' + TH[e.theatre].court + ' dans ' + e.compteur + ' mois']);
    if (e.etat === 'deployee' && e.fatigue >= 75) ech.push([0, '<span class="rouge">' + esc(u.nom) + ' : fatigue ' + Math.round(e.fatigue) + ', relève à prévoir</span>']);
    for (const p of (u.indisponibilites || [])) if (p.debut > state.tour && p.debut - state.tour <= 3) ech.push([p.debut - state.tour, '<span class="ambre">' + esc(u.nom) + ' : arrêt technique dans ' + (p.debut - state.tour) + ' mois</span>']);
  }
  const prevu = state.ressources.budget + state.ressources.enveloppe - coutsMensuels(state);
  if (prevu < 0) ech.push([0, '<span class="rouge">Dépassement budgétaire prévu en fin de mois : ' + prevu.toFixed(1) + ' M€</span>']);
  h += '<div class="bloc"><h2>Échéances et alertes</h2>' + (ech.length ? ech.sort((a, b) => a[0] - b[0]).map(x => '<div>' + x[1] + '</div>').join('') : '<div class="pale">Rien à signaler.</div>');
  h += '<p class="pale">Sélectionnez un théâtre sur la carte, une unité ou un service pour agir.</p></div>';
  return h;
}
function graphique(hist, L, H) {
  const series = [['opinion', '#4caf7a', 'Opinion'], ['menaceInt', '#d9534f', 'Menace int.'], ['credibilite', '#5bc0de', 'Crédibilité'], ['capital', '#e0a030', 'Capital'], ['menaceExt', '#a58bd6', 'Menace ext. réelle']];
  const g = 30, d = 8, hh = H - 30;
  const x = t => g + (L - g - d) * t / NB_TOURS;
  const y = v => 8 + (hh - 8) * (1 - v / 100);
  let h = '<svg width="100%" viewBox="0 0 ' + L + ' ' + H + '" style="max-width:' + L + 'px">';
  for (const v of [0, 50, 100]) h += '<line x1="' + g + '" x2="' + (L - d) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#1f2b33"/><text x="' + (g - 4) + '" y="' + (y(v) + 3) + '" text-anchor="end" fill="#5b6a73" font-size="9">' + v + '</text>';
  for (let t = 0; t <= NB_TOURS; t += 12) h += '<text x="' + x(t) + '" y="' + (hh + 12) + '" text-anchor="middle" fill="#5b6a73" font-size="9">' + (ANNEE_DEPART + t / 12) + '</text>';
  const pts = hist.filter((p, i) => i === hist.length - 1 || p.tour !== hist[i + 1].tour);
  // La menace extérieure réelle n'est révélée qu'en fin de partie (brouillard de guerre)
  const visibles = state.fin ? series : series.slice(0, 4);
  visibles.forEach((sr, i) => {
    if (pts.length > 1) h += '<polyline fill="none" stroke="' + sr[1] + '" stroke-width="1.6" points="' + pts.map(p => x(p.tour).toFixed(1) + ',' + y(p[sr[0]]).toFixed(1)).join(' ') + '"/>';
    h += '<text x="' + (g + i * 88) + '" y="' + (H - 3) + '" fill="' + sr[1] + '" font-size="10">' + sr[2] + '</text>';
  });
  if (pts.length <= 1) h += '<text x="' + (L / 2) + '" y="' + (hh / 2) + '" text-anchor="middle" fill="#5b6a73" font-size="10">Les courbes apparaissent après le premier mois.</text>';
  return h + '</svg>';
}
function decrireEffets(e) {
  if (!e) return '';
  const r = [], sg = v => (v > 0 ? '+' : '') + v;
  const lib = { opinion: 'opinion', capital: 'capital', credibilite: 'crédibilité', menaceInt: 'menace intérieure' };
  for (const k in lib) if (e[k]) r.push(lib[k] + ' ' + sg(e[k]));
  if (e.budget) r.push('budget ' + sg(e.budget) + ' M€');
  if (e.enveloppe) r.push('enveloppe ' + sg(e.enveloppe) + ' M€/mois');
  for (const x of (e.menace || [])) r.push(MT[x.type].nom + ' ' + sg(x.delta));
  for (const x of (e.rens || [])) r.push('renseignement ' + TH[x.theatre].court + ' ' + sg(x.delta));
  for (const x of (e.partenaire || [])) r.push('partenaire ' + TH[x.theatre].court + ' ' + sg(x.delta));
  for (const x of (e.pression || [])) r.push('pression ' + TH[x.theatre].court + ' ' + sg(x.delta));
  for (const x of (e.fatigue || [])) r.push('fatigue ' + (x.unite ? UN[x.unite].nom : CATEGORIES[x.categorie]) + ' ' + sg(x.delta));
  if (e.indispo) r.push(UN[e.indispo.unite].nom + ' indisponible ' + e.indispo.tours + ' mois');
  if (e.allie) r.push('appui allié ' + TH[e.allie.theatre].court);
  for (const x of (e.relation || [])) r.push('relation ' + AL[x.allie].nom + ' ' + sg(x.delta));
  if (e.appui) r.push(appuiDef(e.appui.allie, e.appui.appui).nom + ' (' + TH[e.appui.theatre].court + ', ' + e.appui.tours + ' mois)');
  if (e.crise) r.push('ouverture d’une crise');
  if (e.alea) r.push('issue incertaine (' + pct(e.alea.p) + ' favorable)');
  return r.join(', ');
}
function modalAide() {
  return '<div class="entete">Aide — règles essentielles</div><div class="aide">' +
    '<p><b>Tour.</b> Un tour = un mois, 36 tours (janvier 2015 à décembre 2017). Agissez, puis cliquez sur « Fin du tour ».</p>' +
    '<p><b>Actions.</b> Leur nombre dépend du capital politique (' + PARAMS.actionsBase + ' + 1 par tranche de ' + PARAMS.actionsParCapital + ', maximum ' + PARAMS.actionsMax + '). Déployer, rapatrier, opérer, arbitrer le budget et solliciter un allié consomment une action. Réaffecter des capteurs est gratuit.</p>' +
    '<p><b>Renseignement.</b> Chaque menace a une force réelle cachée. Vous n’en voyez qu’une estimation avec une marge. Plus le renseignement est élevé (capteurs HUMINT, SIGINT, IMINT, unités de recueil), plus l’estimation est précise. Sous ' + PARAMS.rensFauxRapport + ', les rapports peuvent être faux.</p>' +
    '<p><b>Menaces.</b> Une menace négligée grandit, peut s’étendre vers un théâtre voisin et passer à l’action. Les menaces extérieures fortes alimentent la menace intérieure. La pression (forces, capteurs, partenaires, alliés) freine leur croissance.</p>' +
    '<p><b>Unités.</b> Disponible, puis en projection (délai), déployée (la fatigue monte), en régénération après rapatriement. À 100 de fatigue, l’unité est relevée d’office. Le porte-avions a des arrêts techniques programmés.</p>' +
    '<p><b>Article 35.</b> Au-delà de ' + PARAMS.dureeAvantVote + ' mois, une intervention extérieure est soumise au Parlement. Un vote négatif impose le retrait. Les théâtres à forces prépositionnées ne sont pas concernés.</p>' +
    '<p><b>Budget.</b> Chaque mois : solde + enveloppe − coûts. Un dépassement devient du surcoût OPEX et coûte du capital politique.</p>' +
    '<p><b>Crises.</b> Vous pouvez intervenir ou non. Au Levant et au Sahel, l’intervention ouvre un zoom régional : 6 semaines au plus, raids, frappes, reconnaissance, appui aux forces locales (seules capables de reprendre un lieu), évacuation. Ailleurs, elle est résolue globalement.</p>' +
    '<p><b>Défaite.</b> Opinion sous 10, capital à 0, ou menace intérieure à 100 pendant 3 mois. Sinon, bilan noté au 36e tour.</p>' +
    '</div><div class="ligne"><button class="primaire" id="btnFermerAide">Fermer</button></div>';
}

// ---------- Débogage ----------
function rendreDebug() {
  const el = $('debug');
  el.hidden = !ui.debug;
  if (!ui.debug) return;
  let h = '<h2>Débogage — état réel</h2><div class="pale">Graine ' + esc(state.graine) + ' · rngState ' + state.rngState + ' · phase ' + state.phase + ' · tour ' + state.tour + ' · menaceInt100 ' + state.menaceInt100 + '</div>';
  h += '<table class="t"><tr><th>Id</th><th>Type</th><th>Théâtre</th><th>Réelle</th><th>Estimée</th><th>Marge</th><th>Détectée</th><th>Faux</th><th>Pression</th></tr>';
  for (const m of state.menaces) h += '<tr><td>' + m.id + '</td><td>' + MT[m.type].nom + '</td><td>' + TH[m.theatre].court + '</td><td class="ambre">' + m.force + '</td><td>' + (m.estimation === null ? '—' : m.estimation) + '</td><td>' + m.marge + '</td><td>' + (m.detectee ? 'oui' : 'non') + '</td><td>' + (m.rapportFaux ? 'oui' : '') + '</td><td>' + pressionMenace(state, m).toFixed(1) + '</td></tr>';
  h += '</table>';
  if (state.zoom) {
    h += '<h3>Zoom : forces réelles (réserve ' + state.zoom.reserve + ')</h3><div>' + Object.keys(state.zoom.lieux).filter(k => state.zoom.lieux[k].controle === 'ennemi').map(k => nomLieu(state.zoom, k) + ' ' + state.zoom.lieux[k].force).join(' · ') + '</div>';
  }
  h += '<h3>Alliés</h3><div>' + ALLIES.map(A => A.nom + ' ' + state.allies[A.id].relation + (state.allies[A.id].cooldown ? ' (délai ' + state.allies[A.id].cooldown + ')' : '')).join(' · ') + '</div>';
  const ed = verifierDonnees();
  h += '<h3>Contrôle des données</h3><div class="' + (ed.length ? 'rouge' : 'vert') + '">' + (ed.length ? ed.map(esc).join('<br>') : 'Aucune incohérence détectée.') + '</div>';
  h += '<h3>Forcer un événement</h3><div class="ligne"><select id="dbgEv">' + EVENEMENTS.map(e => '<option value="' + e.id + '">' + e.id + ' — ' + esc(e.titre) + '</option>').join('') + '</select><button id="dbgForcer">Forcer</button></div>';
  h += '<h3>Graine</h3><div class="ligne"><input id="dbgGraine" value="' + esc(state.graine) + '"><button id="dbgGraineOk">Appliquer</button></div>';
  h += '<h3>Simulation</h3><div class="ligne"><button id="dbgSim">simuler(20) — résultat dans la console</button></div>';
  el.innerHTML = h;
}

// ---------- Sauvegarde ----------
function exporter() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cellule-de-crise-' + state.graine + '-tour' + (state.tour + 1) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importer(fichier) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!s || s.version !== 1 || typeof s.rngState !== 'number' || !s.ressources || !s.unites || !s.theatres || !Array.isArray(s.menaces)) throw new Error('format inconnu');
      if (s.evenementCourant && !EV[s.evenementCourant]) throw new Error('événement inconnu : ' + s.evenementCourant);
      if (s.menaces.some(m => !MT[m.type] || !TH[m.theatre])) throw new Error('menace incohérente');
      state = migrerEtat(s); ui.selection = null; ui.apercu = null; ui.bilan = null; ui.refMois = null;
      rendre();
      afficherToast('Sauvegarde chargée (graine ' + s.graine + ', ' + dateDuTour(Math.min(s.tour, NB_TOURS - 1)) + ').');
    } catch (e) { afficherToast('Import impossible : ' + e.message); }
  };
  r.readAsText(fichier);
}

// ---------- Gestion des clics et infobulles ----------
document.addEventListener('click', ev => {
  const t = ev.target;
  const act = t.closest('[data-act]');
  if (act && !act.disabled) { jouer(JSON.parse(act.getAttribute('data-act'))); return; }
  const ap = t.closest('[data-apercu]');
  if (ap) { ui.apercu = JSON.parse(ap.getAttribute('data-apercu')); rendreModal(); return; }
  const zs = t.closest('[data-zlieu]');
  if (zs) { ui.zoomLieu = zs.getAttribute('data-zlieu'); ui.zoomUnite = null; rendreZoom(); return; }
  const zu = t.closest('[data-zunite]');
  if (zu) { ui.zoomUnite = zu.getAttribute('data-zunite'); ui.zoomLieu = null; rendreZoom(); return; }
  const s = t.closest('[data-sel]');
  if (s && state) { const [kind, id] = s.getAttribute('data-sel').split(':'); ui.selection = { kind, id }; rendre(); return; }
  switch (t.id) {
    case 'btnLancer': {
      const g = $('inGraine').value.trim() || '1';
      ui.graineAccueil = g; ui.difficulteAccueil = $('inDiff').value;
      state = nouvellePartie(g, ui.difficulteAccueil); ui.selection = null; ui.refMois = null;
      rendre(); break;
    }
    case 'btnFin': terminerTour(); break;
    case 'btnExport': case 'btnExport3': exporter(); break;
    case 'btnImport': case 'btnImport2': $('fichier').click(); break;
    case 'btnAide': ui.aide = true; rendreModal(); break;
    case 'btnFermerAide': ui.aide = false; rendre(); break;
    case 'btnDebug': ui.debug = !ui.debug; rendreDebug(); break;
    case 'btnNouvelle': case 'btnNouvelle2': state = null; ui.selection = null; ui.bilan = null; ui.apercu = null; ui.graineAccueil = String(Date.now() % 1000000); $('debug').hidden = true; ui.debug = false; rendre(); break;
    case 'btnAnnulerApercu': ui.apercu = null; rendreModal(); break;
    case 'btnFermerBilan': ui.bilan = null; rendre(); break;
    case 'dbgForcer': state = forcerEvenement(state, $('dbgEv').value); rendre(); break;
    case 'dbgGraineOk': state = changerGraine(state, $('dbgGraine').value.trim() || '1'); rendre(); break;
    case 'dbgSim': afficherToast('Simulation en cours, voir la console...'); setTimeout(() => { const r = simuler(20); afficherToast('simuler(20) : ' + r.erreurs + ' erreur(s), durée moyenne ' + r.dureeMoyenne + ' tours.'); }, 50); break;
  }
});
$('fichier').addEventListener('change', ev => { if (ev.target.files[0]) importer(ev.target.files[0]); ev.target.value = ''; });
document.addEventListener('mouseover', ev => {
  const el = ev.target.closest('[data-tip]'), ib = $('infobulle');
  if (!el) { ib.style.display = 'none'; return; }
  ib.textContent = el.getAttribute('data-tip');
  ib.style.display = 'block';
});
document.addEventListener('mousemove', ev => {
  const ib = $('infobulle');
  if (ib.style.display !== 'block') return;
  const w = ib.offsetWidth, hh = ib.offsetHeight;
  ib.style.left = Math.min(ev.clientX + 14, window.innerWidth - w - 6) + 'px';
  ib.style.top = Math.min(ev.clientY + 16, window.innerHeight - hh - 6) + 'px';
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (ui.aide) { ui.aide = false; rendre(); } else if (ui.apercu) { ui.apercu = null; rendreModal(); } else if (ui.zoomLieu || ui.zoomUnite) { ui.zoomLieu = null; ui.zoomUnite = null; if (state && state.zoom) rendreZoom(); } }
});

const erreursDonnees = verifierDonnees();
if (erreursDonnees.length) console.warn('Incohérences dans les données :\n' + erreursDonnees.join('\n'));
rendre();
</script>
</body>
